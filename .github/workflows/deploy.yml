name: Build React bundle & Deploy to Cloudflare worker

on:
    push:
        branches:
            - master

jobs:
    build-and-deploy:
        runs-on: ${{ github.event.pull_request.head.repo.full_name && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","proxmox-actions"]') }}
        name: Build & Deploy
        steps:
            - uses: actions/checkout@v2
            - name: Use Node.js
              uses: actions/setup-node@v1
              with:
                  node-version: '12.x'
            - run: npm install
            - run: npm run build --if-present
              env:
                  CI: true
            - name: Publish
              uses: cloudflare/wrangler-action@1.1.0
              with:
                  apiToken: ${{ secrets.CF_API_TOKEN }}
              env:
                  CF_ACCOUNT_ID: ${{secrets.CF_ACCOUNT_ID}}
